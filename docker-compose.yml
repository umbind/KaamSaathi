version: '3.8'

services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: kaamsaathi-postgres
    environment:
      POSTGRES_DB: kaamsaathi
      POSTGRES_USER: kaamsaathi_app
      POSTGRES_PASSWORD: kaamsaathi_staging_secret_change_in_prod
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kaamsaathi_app -d kaamsaathi"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - kaamsaathi-net
    restart: unless-stopped

  redis:
    image: redis:7.2-alpine
    container_name: kaamsaathi-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - kaamsaathi-net
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kaamsaathi-api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: staging
      PORT: 3000
      DATABASE_URL: postgres://kaamsaathi_app:kaamsaathi_staging_secret_change_in_prod@postgres:5432/kaamsaathi
      REDIS_URL: redis://redis:6379
      JWT_SECRET: kaamsaathi_super_secret_jwt_key_at_least_32_bytes_2026!
      OTP_PROVIDER: mock
      APP_NAME: KaamSaathi
      LOG_LEVEL: info
      ALLOWED_ORIGINS: "http://localhost:3000,http://localhost:3001,http://localhost:3002"
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - kaamsaathi-net
    restart: unless-stopped

networks:
  kaamsaathi-net:
    driver: bridge

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local
